# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json
specVersion: '4.0'
metadata:
  name: webapp
type: application
resources:
  configuration:
    propertiesFileSourceEncoding: UTF-8
    paths:
      webapp: "."
server:
  customMiddleware:
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        ignoreCertError: false
        backend:
          - path: /service/bpcust
            destination: srv-api
          - path: /mail
            destination: sap_process_automation_mail
builder:
  resources:
    excludes:
      - "/node_modules/**"
      - "/test/**"
      - "/localService/**"
  customTasks:
    - name: ui5-task-zipper
      afterTask: generateVersionInfo
      configuration:
        archiveName: webapp
        relativePaths: true
        additionalFiles:
          - xs-app.json