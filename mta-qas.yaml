_schema-version: 3.3.0
ID: bp-cust
version: 1.0.0
description: "Business Partner Creation Wizard - QAS"
parameters:
  enable-parallel-deployments: true
  deploy_mode: html5-repo

modules:
  - name: bp-cust-srv
    type: nodejs
    path: gen/backend/srv
    parameters:
      instances: 1
      buildpacks:
        - https://github.com/cloudfoundry/apt-buildpack#v0.2.14
        - nodejs_buildpack
      memory: 2G
      disk-quota: 4G
      env:
        PGOPTIONS: "-c search_path=qas,public"
        SAP_DESTINATION_NAME: QAS
    build-parameters:
      builder: custom
      commands:
        - cp ../../../apt.yml .
        - cp ../../../.puppeteerrc.cjs .
        - env PUPPETEER_SKIP_DOWNLOAD=true npm install --omit=dev --legacy-peer-deps
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: bp-cust-auth
      - name: bp-cust-db
      - name: bp-cust-destination

  - name: bp-cust-db-deployer
    type: nodejs
    path: gen/pg
    parameters:
      no-route: true
      health-check-type: process
      buildpacks:
        - nodejs_buildpack
      memory: 512M
      disk-quota: 512M
      env:
        DB_SCHEMA: qas
        PGOPTIONS: "-c search_path=qas,public"
    requires:
      - name: bp-cust-db

  - name: bp-cust
    type: approuter.nodejs
    path: frontend/router
    parameters:
      keep-existing-routes: true
      disk-quota: 1G
      memory: 1G
    requires:
      - name: srv-api
        group: destinations
        properties:
          name: srv-api
          url: ~{srv-url}
          forwardAuthToken: true
      - name: bp-cust-auth
      - name: bp-cust-html5-runtime
    provides:
      - name: app-api
        properties:
          app-protocol: ${protocol}
          app-uri: ${default-uri}

  - name: bp-cust-app-deployer
    type: com.sap.application.content
    path: gen
    build-parameters:
      build-result: frontend
      requires:
        - name: bpcustwebapp
          artifacts:
            - webapp.zip
          target-path: frontend
    requires:
      - name: bp-cust-auth
      - name: srv-api
      - name: bp-cust-html5-repo-host
        parameters:
          content-target: true
          config:
            HTML5Runtime_enabled: true

  - name: bpcustwebapp
    type: html5
    path: frontend/webapp
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm install
        - npm run build
      supported-platforms: []

resources:
  - name: bp-cust-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: bp-cust-app-qa
        tenant-mode: dedicated
        oauth2-configuration:
          credential-types:
            - "binding-secret"
            - "x509"
          redirect-uris:
            - https://*~{app-api/app-uri}/**
    requires:
      - name: app-api

  - name: bp-cust-html5-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host

  - name: bp-cust-html5-runtime
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-runtime

  - name: bp-cust-db
    type: org.cloudfoundry.existing-service
    parameters:
      service-name: QAS_PostgreSQL

  - name: bp-cust-destination
    type: org.cloudfoundry.existing-service
    parameters:
      service-name: QAS

build-parameters:
  before-all:
    - builder: custom
      commands:
        - env PUPPETEER_SKIP_DOWNLOAD=true npm install --legacy-peer-deps
        - npx cds build --production
        - cp backend/db/deploy.js gen/pg/deploy.js
